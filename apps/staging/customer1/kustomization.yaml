apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "532997af-3315-4057-b504-076e0c668ef0"
      - op: replace
        path: /spec/parameters/tenantId
        value: "dd6bc44b-1f3c-4109-a358-9f8b2fe420c9"
  - target:
      kind: ObjectStore
      name: customer1-objectstore
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: "https://yinkabackupsstaging.blob.core.windows.net/customer1"
