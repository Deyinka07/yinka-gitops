apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brutus-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - brutus.staging.saltechng.com
      secretName: brutus-tls
  rules:
    - host: brutus.staging.saltechng.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brutus-n8n
                port:
                  number: 3008
